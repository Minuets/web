<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pop &amp; push</title>
</head>

<body>
  <script>
    let kdata = ['연예인1', '연예인2', '연예인3', '연예인4', '연예인5'];
    //push 메소드 : 배열의 마지막 위치에 데이터를 추가하고 배열의 길이를 반환
    let p1 = kdata.push('연예인6', '연예인7');
    console.log(kdata);
    console.log(p1); //배열의 길이를 나타냄

   //pop 메소드 : 배열의 마지막 위치에 있는 데이터를 삭제하고 삭제한 데이터를 반환
    let p2 = kdata.pop();
    console.log(p2); //빠지는 요소를 나타냄 (p2가 데이터를 가져감)
    console.log(kdata);
  </script>
</body>

</html>
