<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reverse method</title>
</head>

<body>
  <script>
    let data = ['변우석9', '변우석8', '변우석5', '변우석1'];
    let rData = data.reverse();
    console.log(data.join('-'));
    console.log(rData.join('-')); //기본배열도 바꿈
  </script>
</body>

</html>
