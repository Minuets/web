<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test</title>
</head>

<body>
  <div id="result"></div>
  <script>
    /*
      국어, 영어, 수학 점수를 prompt로 받아와서
      토탈
      평균 /3
      학점 

      평균이 90점 이상이면 A
      80점 이상이면 B
      70점 이상이면 C
      60점 이상이면 D
      그외는 F
      "당신의 학점은      입니다"
  */

    let ko = Number(prompt('국어'));
    let en = Number(prompt('영어'));
    let ma = Number(prompt('수학'));
    let total = ko + en + ma;
    let avrg = total / 3; //3을 변수 i로 두면 항목 늘었을때 편할듯
    let grade;
    if (avrg >= 90) {
      grade = 'A';
    } else if (avrg >= 80) {
      grade = 'B';
    } else if (avrg >= 70) {
      grade = 'C';
    } else if (avrg >= 60) {
      grade = 'D';
    } else {
      grade = 'F';
    }

    document.querySelector('#result').innerHTML = ('당신의 학점은 ' + grade + '입니다');
                                                // `당신의 학점은 ${grade}입니다`
  </script>
</body>

</html>
