<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>삼항 조건 연산자 test</title>
</head>

<body>
  <script>
    //num이라는 변수에 prompt로 숫자를 받아와서
    let num = Number(prompt());
    //result라는 변수에 num 변수가 퍼센트계산 (%) = 짝수
    let result = num % 2;
    //삼항조건 연산자 사용
    //comment 라는 변수에
    //num은 짝수입니다, 홀수입니다

    //let comment = (result === 0) ? (`${num}은(는) 짝수입니다.`) : (`${num}은(는) 홀수입니다.`);

    let comment = result ? (`${num}은(는) 홀수입니다.`) : (`${num}은(는) 짝수입니다.`); //0은 무조건 거짓값이므로
    //comment가 h2태그로 뜨게
    document.write(`<h2>${comment}</h2>`);
  </script>
  <!-- 참,거짓 값에 따라 움직이는 결과물 만들기 가능? ex) 20px 스크롤 시 참:nav 위로 20px 거짓:nav 고정 (???) -->
</body>

</html>
