<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나머지 연산</title>
</head>

<body>
  <script>
    let evenOdd = prompt('숫자를 입력하세요'); //문자열로 입력됨
    evenOdd = Number(evenOdd); //숫자열로 바꿔줌
    let comment;
    if (evenOdd % 2 === 0) {
      comment = evenOdd + '는(은) 짝수 입니다';
    } else {
      comment = evenOdd + '는(은) 홀수 입니다';
    }
    document.write(comment);
  </script>
</body>

</html>
