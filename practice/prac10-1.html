<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>practice 6색 도형 돌리기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .con {
      width: 500px;
      height: 500px;
      position: relative;
      margin: 300px auto;
    }

    .con .card {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 50%;
      top: 50%;
      /* transform: translate(-50%, -50%); */
      transition: 4s;
      transform-style: preserve-3d;
      transform-origin: left top;
      perspective: 2000px;
      /* background: #ccc; */
    }

    .con:hover .card {
      transform: rotateY(360deg) skew(30deg, -30deg) rotateX(45deg);
    }

    .fo {
      width: 100%;
      height: 100%;
      position: absolute;
      backface-visibility: hidden;
      /* background: pink; */
    }

    .f1 {
      background: lightblue;
    }

    .f2 {
      background: red;
      transform: rotateY(45deg);
    }

    .f3 {
      background: blue;
      transform: rotateY(-45deg);
    }

    .f4 {
      background: lightcoral;
      transform: rotateY(180deg);
    }

    .f5 {
      background: green;
      transform: rotateY(90deg);
    }

    .f6 {
      background: antiquewhite;
      transform: rotateY(-90deg);
    }
  </style>
</head>

<body>
  <div class="con">
    <div class="card">
      <div class="fo f1"></div>
      <div class="fo f2"></div>
      <div class="fo f3"></div>
      <div class="fo f4"></div>
      <div class="fo f5"></div>
      <div class="fo f6"></div>
    </div>
  </div>
</body>

</html>
