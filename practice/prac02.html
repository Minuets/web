<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    em{
      color: red;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <form>
    <fieldset>
      <ul>
        <li>
          <label>이름<input type="text" autofocus></label>
        </li>
        <li>
          <label>학번<input type="number" placeholder="하이픈 없이 입력"></label>
        </li>
        <li>
          <label>영어회화(초급)<input type="text" value="오전09:00~11:00" readonly></label>
        </li>
        <li>
          <label><em>*</em>닉네임 <input type="text" required></label>
        </li>
        <li>
          <input type="submit" value="전송">
        </li>
      </ul>
    </fieldset>
  </form>
</body>
</html>
