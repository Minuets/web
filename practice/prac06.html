<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    main {
      width: 600px;
      height: 500px;
      background: gray;
      margin: 30% auto;
      padding: 100px;
      border: 2px solid #ccc;
    }
    .container {
      width: 500px;
      height: 400px;
      background: red;
      padding-left: 100px;
      padding-top: 100px;
      /* padding: 100px 100px 100px 100px; */
      border: 2px solid #ccc;
    }
    .inner {
      width: 400px;
      height: 300px;
      background: green;
      border: 2px solid #ccc;
      text-align: center;
      line-height: 300px;
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <div class="container">
      <div class="inner">컨텐츠</div>
    </div>
  </main>
</body>
</html>
