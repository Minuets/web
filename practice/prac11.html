<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    let y = 1;
    for (x = 0; x < 80; x++) {
      y += x;
      if (y % 5 == 0 && y % 3 == 0 && y % 7 == 0) {
        continue;
      } else if (y % 4 == 0) {
        for (x; x < 80; x++) {
          y += x;
        }
      } else if (y % 6 != 0) {
        document.write(y + '<br>');
      }
    }
  </script>
</body>

</html>
