<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <form>
    <fieldset>
      <legend>연습용</legend>

      <ul>
        <li>
          <label for="tex">텍스트</label>
          <input type="text" id="tex" size="50">
        </li>
        <li>
          <label for="ema">이메일</label>
          <input type="email" id="ema" required autofocus>
        </li>
        <li>
          <label for="pas">비밀번호</label>
          <input type="password" id="pas" value="88888888" maxlength="8">
        </li>
        <li>
          <label for="sea">search</label>
          <input type="search" id="sea" placeholder="찾기">
        </li>
        <li>
          <label for="ur">주소</label>
          <input type="url" id="ur" value="http://www.naver.com/" readonly>
        </li>
      </ul>

      <input type="submit" value="제출">
      <input type="reset" value="돌아가기">
    </fieldset>

    <fieldset>

      <label for="num">숫자</label>
      <input type="number" id="num" min="3" max="100" step="2" value="3">
      <br>
      <hr>

      <label><input type="radio" name="chck" value="radio" checked>1개선택</label>
      <label><input type="radio" name="chck" value="radio">1개선택</label>
      <label><input type="radio" name="chck" value="radio">1개선택</label>
      <label><input type="radio" name="chck" value="radio">1개선택</label>
      <br>
      <hr>
      <label><input type="checkbox" value="checkbox">chk</label>
      <label><input type="checkbox" value="checkbox">chk</label>
      <label><input type="checkbox" value="checkbox">chk</label>
      <label><input type="checkbox" value="checkbox">chk</label>

    </fieldset>

    <fieldset>
      <legend>다중선택</legend>

      <label for="s1">다중선택</label>
      <select id="s1" size="1">
        <option value="q1">선1</option>
        <option value="q2">선2</option>
        <option value="q3">선3</option>
        <option value="q4">선4</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>다중선택2</legend>
      <label for="s2">다중선택2</label>
      <select id="s2">
        <optgroup label="선택">
          <option value="w1">선1</option>
          <option value="w2">선2</option>
          <option value="w3">선1</option>
          <option value="w4">선1</option>
        </optgroup>
        <optgroup label="선택">
          <option value="e1">선1</option>
          <option value="e2">선1</option>
          <option value="e3">선1</option>
          <option value="e4">선1</option>
        </optgroup>
      </select>
    </fieldset>

    <fieldset> <!-- datalist에 optgroup은 안먹힘 -->
      <input type="text" list="cho">
      <datalist id="cho">
        <optgroup label="22">
          <option value="11" label="33">11</option>
          <option value="11">11</option>
          <option value="11">11</option>
        </optgroup>
        <optgroup>
          <option value="11">11</option>
          <option value="11">11</option>
          <option value="11">11</option>
        </optgroup>
      </datalist>
    </fieldset>
  </form>

  <form>
    <textarea></textarea><!-- textarea에 다른 태그는 적어도 적용 X 원문 그대로 노출됨 -->
  </form>
</body>

</html>
<!-- input 태그의 속성들
     text: size / value / maxleghth
     number: min / max / step / value
     radio: name / value / checked
     all: autofocus / placeholder / readonly / required -->
