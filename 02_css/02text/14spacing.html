<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글자간 간격, 단어간 간격</title>

  <style>
    .ls {
      letter-spacing: -1px; /* 양수 음수 가능 */
    }

    .ws {
      word-spacing: 0.5em;/* em rem 단위 가능 */
    }
  </style>
</head>

<body>
  <h1>letter spacing</h1>
  <h1 class="ls">letter spacing</h1>
  <h2>word spacing</h2>
  <h2 class="ws">word spacing</h2>
</body>

</html>
