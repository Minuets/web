<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폰트사이즈</title>
  <style>
    :root{font-size: 100px;}

    .px40 {
      font-size: 40px;
    }

    .em4 {
      font-size: 4em;
    } /* 설정한 요소가 기본요소)부모요소가 40px이라 4배 = 160px */

    .rem4 {
      font-size: 4rem;
    } /* 페이지 자체(root) 기본요소의 배수 */
  </style>
</head>
<body>
  <div class="px40">
    <p>기본 사이즈</p>
    <p class="em4">4em</p>
    <p class="rem4">4rem</p>
  </div>
</body>
</html>
