<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마진 중첩 현상</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .container {
      width: 1300px;
      height: 500px;
      background: #ccc;
      border: 2px solid red;
      margin: 50px auto;
    }

    /* 자식요소에 margin값을 넣으면 부모요소도 같이 먹음 (margin 겹침 현상)
        부모요소에게 margin값을 주는게 맞음 */
    .first {
      margin: 50px auto 0;
    }

    main {
      background: lavender;
      padding-block: 30px;
    }

    /* 부모요소의 여백을 남기려면 부모요소에 padding값을 주기 (자식요소에 margin 값 X) */

    main .container {
      margin-block: 0;
      width: 1500px;
      background: green;
      padding-top: 10px;
    }

    #box1 {
      width: 300px;
      height: 300px;
      background: pink;
      /* margin-top: 10px; */

    }

    #box2 {
      width: 100px;
      height: 50px;
      background: gold;
      margin-block: 50px;
    }

    #box3 {
      width: 200px;
      height: 100px;
      background: coral;
    }
  </style>
</head>

<body>
  <div class="container first"></div>
  <main>
    <div class="container">
      <div id="box1"></div>
      <div id="box2"></div>
      <div id="box3"></div>
    </div>
  </main>
  <footer class="container"></footer>
</body>

</html>
