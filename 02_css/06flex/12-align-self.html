<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>align-self</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container{
      display: flex;
      height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .flex_item:nth-child(2) {
      /* align-self : 자식속성의 교차축 정렬법 */
      align-self: auto; /* 부모의 align-items를 따라감 */
      align-self: stretch;
      align-self: flex-start;
      align-self: flex-end;
      align-self: baseline;
      align-self: center;
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaaaaa</div>
    <div class="flex_item">bbbbbbbbbbbbbbb</div>
    <div class="flex_item">ccccccccccccccccccccc</div>
  </div>
</body>

</html>
