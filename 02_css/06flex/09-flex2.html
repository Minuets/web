<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex</title>
  <link rel="stylesheet" href="default.css">

  <style>
    .flex_container {
      display: flex;
      flex-wrap: wrap;
      width: 1360px;
      margin: 0 auto;
    }

    .flex_item {
      flex: 1 1 auto; /* 줄이 바뀌면 그 줄의 여백을 나눠가짐 */
    }

    .flex_item:nth-child(1) {
      width: 30%;
    }

    .flex_item:nth-child(2) {
      width: 60%;
    }

    .flex_item:nth-child(3) {
      width: 20%;
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">
      <p>
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Cupiditate accusantium quisquam illum, iure
        repellendus suscipit ut mollitia laborum et totam non voluptatibus asperiores reiciendis eius saepe corporis quo
        praesentium dolores!
      </p>
    </div>
    <div class="flex_item">bbb</div>
    <div class="flex_item">cccccccc</div>
  </div>
</body>

</html>
