<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-basis</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container{
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .flex_item {
      width: 100px;
      flex-basis: auto; /* 기본값 */
      flex-basis: 200px; /* 아이템의 사이즈 조절 */
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaaaaa</div>
    <div class="flex_item">bbbbbbbbbbbbbbb</div>
    <div class="flex_item">ccccccccccccccccccccc</div>
  </div>
</body>

</html>
