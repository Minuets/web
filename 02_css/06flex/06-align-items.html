<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>align-items</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      width: 800px;
      height: 300px;
      align-items: stretch; /* 기본값 : 아이템들이 교차축 방향으로 쭉 늘어남 */
      align-items: flex-end; /* 교차축의 끝점으로 정렬 */
      align-items: center; /* 교차축의 중앙으로 정렬 */
      align-items: flex-start; /* 교차축의 시작점으로 정렬 */
      /* align-items: baseline; : 교차축의 문자 기준선(밑선)으로 정렬 */
    }

    .flex_item:nth-child(1) {
      font-size: 30px;
    }

    .flex_item:nth-child(2) {
      font-size: 12px;
    }
    
    .flex_item:nth-child(3) {
      font-size: 50px;
      align-self: center;
    }

    .parent {
      margin-top: 50px;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaaaaa</div>
    <div class="flex_item">bbbbbbbbbbbbbbb</div>
    <div class="flex_item">ccccccccccccccccccccc</div>
  </div>
  <div class="flex_container parent">
    <div class="flex_item">ccccccccccccccccccccc</div>
  </div>
</body>

</html>
