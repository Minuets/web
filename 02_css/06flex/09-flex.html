<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex</title>
  <link rel="stylesheet" href="default.css">
<style>
  .parent {
    margin-top: 100px;
  }

.flex_container {
  display: flex;
}
/* flex : flex-grow flex-shrink flex-basis 순서로 씀 */
.flex_item {
  flex: 1 1 0; /* 여백을 1칸씩 먹고, 크기가 줄어들게끔, 사이즈 없이 부모요소의 칸을 균일하게 가져감 */
  flex: 1; /* 위 flex:1 1 0;을 줄여씀 */
}

.con {
  width: 800px;
  margin: 0 auto;
}

.con .flex_item:nth-child(1) {
  flex: 1;
}
.con .flex_item:nth-child(2) {
  flex: 3;
}
.con .flex_item:nth-child(3) {
  flex: 2;
} /* 부모요소 크기의 1:3:2로 나눠가짐 */

.parent .flex_item {
  flex: 1 1 auto; /* 본인의 값을 유지하고 나눠가짐 */
  flex: 1 auto; /* 위 flex: 1 1 auto 를 줄여씀 */
}
</style>
</head>
<body>
  <div class="flex_container con">
    <div class="flex_item">
      <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestiae inventore deleniti dolor consectetur amet
        aperiam enim deserunt ipsam harum, veritatis error. Vel odio repudiandae ab doloremque provident reiciendis
        inventore facilis.</p>
    </div>
    <div class="flex_item">BB</div>
    <div class="flex_item">CCCCCCC</div>
  </div>
  <div class="flex_container parent">
    <div class="flex_item">1111111111111</div>
    <div class="flex_item">22222222</div>
    <div class="flex_item">333</div>
  </div>
</body>
</html>
