<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>justify-content</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container{
      display: flex;
      width: 80%;
      margin: 0 auto;
      justify-content: flex-start; /* item들을 시작점으로 정렬 */
      justify-content: flex-end; /* 끝점으로 정렬 */
      justify-content: center; /* 중앙으로 정렬 */
      justify-content: space-between; /* 아이템들 사이 간격 균일 */
      justify-content: space-around; /* 아이템들 둘레 간격 균일 */
      justify-content: space-evenly; /* 아이템들의 사이와 양끝 간격 균일 */
      justify-content: center;
      gap: 20px;
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaaaaa</div>
    <div class="flex_item">bbbbbbbbbbbbbbb</div>
    <div class="flex_item">ccccccccccccccccccccc</div>
  </div>
</body>

</html>
