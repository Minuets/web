<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 뒤집기</title>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .con {
      width: 300px;
      height: 300px;
      background: #ccc;
      position: relative;
      margin: 400px auto;
    }

    .con .card {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      transition: .6s;
      transform-style: preserve-3d;
      transform-origin: top;
    }

    .con:hover .card {
      transform: rotateX(180deg);
    }

    .face {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .back {
      transform: rotateX(180deg);
    }
  </style>

</head>

<body>
  <div class="con">
    <div class="card">
      <div class="face front"><img src="https://cdn.hankooki.com/news/photo/202510/290130_405466_1760741410.png"
          alt="변우석앞면"></div>
      <div class="face back"><img
          src="https://talkimg.imbc.com/TVianUpload/tvian/TViews/image/2026/08/21/2a7d684d-3244-4dc7-b3cc-e54df4fd87f6.jpg"
          alt="변우석뒷면"></div>
    </div> <!-- //.card -->
  </div><!-- //.con -->
</body>

</html>
