<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition</title>
  <style>
    .tr1 {
      width: 100px;
      height: 100px;
      background: blue;
      border: 1px solid #000;
    }

    .tr1:hover {
      width: 200px;
      height: 150px;
      background: red;
      transition-property: width,height; /* 적용할 요소 불러오기 */
      transition-duration: 2s,1s; /* 불러온 요소만큼 적기 (없으면 적용 안됨.) */
    }
  </style>
</head>

<body>
  <div class="tr1"></div>
</body>

</html>
